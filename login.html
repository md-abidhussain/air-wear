<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Wear | Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main_style.css">
</head>
<body class="login_background">
    <div class="login_card_design">
        <div class="text-center mb-4">
            <img src="assets/images/logo.png" alt="Air Wear Logo" class="app_logo">
            <h2 class="fw-bold text-dark">Air Wear</h2>
            <p class="text-muted">Holistic Weather-Based Advice System</p>
        </div>
        
        <div class="d-grid mb-3">
            <button id="google_login_button" class="btn btn-outline-dark auth_btn fw-semibold py-3 d-flex align-items-center justify-content-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <div class="text-center text-muted mb-3">
            <span class="bg-white px-2 text-uppercase" style="font-size: 0.8rem; letter-spacing: 1px;">Or continue without account</span>
        </div>

        <div class="d-grid mb-3">
            <button id="guest_login_button" class="btn btn-primary auth_btn fw-semibold py-3 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-person-badge"></i> View as Guest
            </button>
        </div>

        <div class="form-check mt-4">
            <input class="form-check-input" type="checkbox" id="newsletter_checkbox" checked>
            <label class="form-check-label text-muted" style="font-size: 13px;" for="newsletter_checkbox">
                Subscribe to personalized daily weather & wellness email alerts.
            </label>
        </div>
        
        <div id="login_error_message" class="text-danger mt-3 text-center" style="display: none;"></div>
    </div>
    
    <script src="js/login_auth.js"></script>
</body>
</html>
